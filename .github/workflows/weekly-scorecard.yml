name: Weekly Cadence Scorecard + Pilot Comparison

# Replicates the local `run_weekly.sh` (was launchd com.clio.cadence-scorer,
# Friday 17:00 America/Vancouver). Runs the SalesLoft scorer, which regenerates
# BOTH index.html and pilot_comparison.html, then commits the refreshed outputs
# back to main. On Clio Workshop, a push to main auto-redeploys the app.
#
# TIMEZONE: GitHub cron is UTC and does NOT observe DST.
#   0 0 * * 6  = Saturday 00:00 UTC = Friday 17:00 PDT (summer) / 16:00 PST (winter).
# If you want a hard 17:00 local year-round, see the DST note in
# .github/workflows/README-actions.md.
on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: weekly-scorecard
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the regenerated outputs back to the repo

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1) Score: fetch SalesLoft, append cadence_scores_master.csv,
      #    regenerate index.html AND pilot_comparison.html. Fatal on error.
      - name: Run cadence scorer
        env:
          SALESLOFT_API_TOKEN: ${{ secrets.SALESLOFT_API_TOKEN }}
        run: python3 -u salesloft_cadence_scorer.py

      # 1b) Step-level detail cache (email/call breakdown for the "▸ steps" popup).
      #     Non-fatal, exactly as in run_weekly.sh — a failure here must not block
      #     the scorecard from publishing.
      - name: Build step-stats cache (non-fatal)
        continue-on-error: true
        env:
          SALESLOFT_API_TOKEN: ${{ secrets.SALESLOFT_API_TOKEN }}
        run: python3 -u build_step_stats_cache.py

      # 2) Commit + push the same file set run_weekly.sh pushed.
      - name: Commit refreshed outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            cadence_scores_master.csv \
            index.html \
            pilot_comparison.html \
            pilot_legacy_snapshot.json \
            pilot_period_metrics.json \
            step_stats_cache.json \
            archive_confirmed.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Cadence scorecard update $(date +%Y-%m-%d)"
            git push
          fi
