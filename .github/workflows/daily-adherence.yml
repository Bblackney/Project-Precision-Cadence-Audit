name: Daily Cadence Adherence

# Replicates the local `run_adherence.sh` (was launchd com.clio.cadence-adherence,
# every day 06:00 America/Vancouver). Pulls SalesLoft, computes adherence, renders
# adherence.html, then commits the refreshed outputs back to main. On Clio
# Workshop, a push to main auto-redeploys the app.
#
# PRIVACY: adherence_data.json / adherence_scores_master.csv contain REP-LEVEL
# performance data. This is corporate/customer data — allowed in the Okta-gated
# Workshop. Do not mirror these outputs to any public location.
#
# TIMEZONE: GitHub cron is UTC and does NOT observe DST.
#   0 13 * * *  = 13:00 UTC = 06:00 PDT (summer) / 05:00 PST (winter).
# See the DST note in .github/workflows/README-actions.md if you need exact local time.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-adherence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  adherence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1) Pull SalesLoft, compute adherence, append CSV + JSON, update the
      #    actions ledger. Fatal on error (matches run_adherence.sh).
      - name: Run adherence scorer
        env:
          SALESLOFT_API_TOKEN: ${{ secrets.SALESLOFT_API_TOKEN }}
        run: python3 -u salesloft_adherence_scorer.py

      # 1b) Render adherence.html from the fresh data (inlines adherence_data.json
      #     into adherence_template.html).
      - name: Build adherence.html
        run: python3 -u build_adherence_html.py

      # 2) Commit + push the same file set run_adherence.sh pushed.
      #    index.html is staged too (only committed if it actually changed).
      - name: Commit refreshed outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            adherence_scores_master.csv \
            adherence_data.json \
            adherence.html \
            actions_ledger.json \
            index.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Cadence adherence update $(date +%Y-%m-%d)"
            git push
          fi
